<script id="data" type="application/json">[{"year":2010,"article":"One basic weakness in a conservation system based wholly on economic motives is that most members of the land community have no economic value. Yet these creatures are members of the biotic community and, if its stability depends on its integrity, they are entitled to continuance.\n\nWhen one of these noneconomic categories is threatened and, if we happen to love it, we invent excuses to give it economic importance. At the beginning of the century songbirds were supposed to be disappearing. (46) Scientists jumped to the rescue with some distinctly shaky evidence to the effect that insects would eat us up if birds failed to control them. The evidence had to be economic in order to be valid.\n\nIt is painful to read these roundabout accounts today. We have no land ethic yet, (47) but we have at least drawn nearer the point of admitting that birds should continue as a matter of intrinsic right, regardless of the presence or absence of economic advantage to us.\n\nA parallel situation exists in respect of predatory mammals and fish-eating birds. (48) Time was when biologists somewhat overworked the evidence that these creatures preserve the health of game by killing the physically weak, or that they prey only on “worthless” species. Here again, the evidence had to be economic in order to be valid. It is only in recent years that we hear the more honest argument that predators are members of the community, and that no special interest has the right to exterminate them for the sake of benefit, real or fancied, to itself.\n\nSome species of trees have been \"read out of the party\" by economics-minded foresters because they grow too slowly, or have too low a sale value to pay as timber crops. (49) In Europe, where forestry is ecologically more advanced, the noncommercial tree species are recognized as members of the native forest community, to be preserved as such, within reason. Moreover, some have been found to have a valuable function in building up soil fertility. The interdependence of the forest and its constituent tree species, ground flora, and fauna is taken for granted.\n\nTo sum up: a system of conservation based solely on economic self-interest is hopelessly lopsided. (50) It tends to ignore, and thus eventually to eliminate, many elements in the land community that lack commercial value, but that are essential to its healthy functioning. It assumes, falsely, that the economic parts of the biotic clock will function without the uneconomic parts.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2011,"article":"With its theme that “Mind is the master weaver,” creating our inner character and outer circumstances, the book As a Man Thinketh by James Allen is an in-depth exploration of the central idea of self-help writing.\n\n(46) Allen's contribution was to take an assumption we all share – that because we are not robots we therefore control our thoughts – and reveal its erroneous nature. Because most of us believe that mind is separate from matter, we think that thoughts can be hidden and made powerless; this allows us to think one way and act another. However, Allen believed that the unconscious mind generates as much action as the conscious mind, and (47) while we may be able to sustain the illusion of control through the conscious mind alone, in reality we are continually faced with a question: \"Why cannot I make myself do this or achieve that?\"\n\nSince desire and will are damaged by the presence of thoughts that do not accord with desire, Allen concluded: “We do not attract what we want, but what we are.” Achievement happens because you as a person embody the external achievement; you don’t “get” success but become it. There is no gap between mind and matter.\n\nPart of the fame of Allen's book is its contention that \"Circumstances do not make a person, they reveal him.\" (48) This seems a justification for neglect of those in need, and a\n\nrationalization of exploitation, of the superiority of those at the top and the inferiority of those at the bottom.\n\nThis, however, would be a knee-jerk reaction to a subtle argument. Each set of circumstances, however bad, offers a unique opportunity for growth. If circumstances always determined the life and prospects of people, then humanity would never have progressed. In fact, (49) circumstances seem to be designed to bring out the best in us, and if we feel that we have been \"wronged\" then we are unlikely to begin a conscious effort to escape from our situation. Nevertheless, as any biographer knows, a person's early life and its conditions are often the greatest gift to an individual.\n\nThe sobering aspect of Allen's book is that we have no one else to blame for our present condition except ourselves. (50) The upside is the possibilities contained in knowing that everything is up to us; where before we were experts in the array of limitations, now we become authorities of what is possible.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2012,"article":"Since the days of Aristotle, a search for universal principles has characterized the scientific enterprise. In some ways, this quest for commonalities defines science. Newton's laws of motion and Darwin's evolution each bind a host of different phenomena into a single explicatory framework.\n\n(46) In physics, one approach takes this impulse for unification to its extreme, and seeks a theory of everything – a single generative equation for all we see. It is becoming less clear, however, that such a theory would be a simplification, given the dimensions and universes that it might entail. Nonetheless, unification of sorts remains a major goal.\n\nThis tendency in the natural sciences has long been evident in the social sciences too. 47\n\nHere, Darwinism seems to offer justification, for if all humans share common origins, it seems reasonable to suppose that cultural diversity could also be traced to more constrained beginnings. Just as the bewildering variety of human courtship rituals might all be considered forms of sexual selection, perhaps the world's languages, music, social and religious customs and even history are governed by universal features. 48 To filter out what is unique from what is shared might enable us to understand how complex cultural behavior arose and what guides it in evolutionary or cognitive terms.\n\nThat, at least, is the hope. But a comparative study of linguistic traits published online today supplies a reality check. Russell Gray at the University of Auckland and his colleagues consider the evolution of grammars in the light of two previous attempts to find universality in language.\n\nThe most famous of these efforts was initiated by Noam Chomsky, who suggested that humans are born with an innate language-acquisition capacity that dictates a universal grammar. A few generative rules are then sufficient to unfold the entire fundamental structure of a language, which is why children can learn it so quickly.\n\n(49) The second, by Joshua Greenberg, takes a more empirical approach to universality, identifying traits (particularly in word order) shared by many languages, which are considered to represent biases that result from cognitive constraints.\n\nGray and his colleagues have put them to the test by examining four family trees that between them represent more than 2,000 languages. (50) Chomsky's grammar should show patterns of language change that are independent of the family tree or the pathway tracked through it, whereas Greenbergian universality predicts strong co-dependencies between particular types of word-order relations. Neither of these patterns is borne out by the analysis, suggesting that the structures of the languages are lineage-specific and not governed by universals.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2013,"article":"It is speculated that gardens arise from a basic human need in the individuals who made them: the need for creative expression. There is no doubt that gardens evidence an irrepressible urge to create, express, fashion, and beautify and that self-expression is a basic human urge; (46) yet when one looks at the photographs of the gardens created by the homeless, it strikes one that, for all their diversity of styles, these gardens speak of various other fundamental urges, beyond that of decoration and creative expression.\n\nOne of these urges has to do with creating a state of peace in the midst of turbulence, a “still point of the turning world,” to borrow a phrase from T. S. Eliot.\n\n(47) A sacred place of peace, however crude it may be, is a distinctly human need, as opposed to shelter, which is a distinctly animal need. This distinction is so much so that where the latter is lacking, as it is for these unlikely gardeners, the former becomes all the more urgent. Composure is a state of mind made possible by the structuring of one's relation to one's environment. (48) The gardens of the homeless, which are in effect homeless gardens, introduce form into an urban environment where it either didn't exist or was not discernible as such. In so doing they give composure to a segment of the inarticulate environment in which they take their stand.\n\nAnother urge or need that these gardens appear to respond to, or to arise from, is so intrinsic that we are barely ever conscious of its abiding claims on us. When we are deprived of green, of plants, of trees, (49) most of us give in to a demoralization of spirit which we usually blame on some psychological conditions, until one day we find ourselves in a garden and feel the oppression vanish as if by magic. In most of the homeless gardens of New York City the actual cultivation of plants is unfeasible, yet even so the compositions often seem to represent attempts to call forth the spirit of plant and animal life, if only symbolically, through a clumplike arrangement of materials, an introduction of colors, small pools of water, and a frequent presence of petals or leaves as well as of stuffed animals. On display here are various fantasy elements whose reference, at some basic level, seems to be the natural world. (50) It is this implicit or explicit reference to nature that fully justifies the use of the word garden, though in a “liberated” sense, to describe these synthetic constructions. In them we can see biophilia — a yearning for contact with nonhuman life — assuming uncanny representational forms.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2014,"article":"Music means different things to different people and sometimes even different things to the same person at different moments of his life. It might be poetic, philosophical, sensual, or mathematical, but in any case it must, in my view, have something to do with the soul of the human being. Hence it is metaphysical; but the means of expression is purely and exclusively physical: sound. I believe it is precisely this permanent coexistence of metaphysical message through physical means that is the strength of music. (46) It is also the reason why when we try to describe music with words, all we can do is articulate our reactions to it, and not grasp music itself.\n\nBeethoven's importance in music has been principally defined by the revolutionary nature of his compositions. He freed music from hitherto prevailing conventions of harmony and structure. Sometimes I feel in his late works a will to break all signs of continuity. The music is abrupt and seemingly disconnected, as in the last piano sonata. In musical expression, he did not feel restrained by the weight of convention. (47) By all accounts he was a freethinking person, and a courageous one, and I find courage an essential quality for the understanding, let alone the performance, of his works.\n\nThis courageous attitude in fact becomes a requirement for the performers of Beethoven's\n\nmusic. His compositions demand the performer to show courage, for example in the use of dynamics. (48) Beethoven's habit of increasing the volume with an extreme intensity and then abruptly following it with a sudden soft passage was only rarely used by composers before him.\n\nBeethoven was a deeply political man in the broadest sense of the word. He was not interested in daily politics, but concerned with questions of moral behavior and the larger questions of right and wrong affecting the entire society. (49) Especially significant was his view of freedom, which, for him, was associated with the rights and responsibilities of the individual: he advocated freedom of thought and of personal expression.\n\nBeethoven's music tends to move from chaos to order as if order were an imperative of human existence. For him, order does not result from forgetting or ignoring the disorders that plague our existence; order is a necessary development, an improvement that may lead to the Greek ideal of spiritual elevation. It is not by chance that the Funeral March is not the last movement of the Eroica Symphony, but the second, so that suffering does not have the last word.\n\n(50) One could interpret much of the work of Beethoven by saying that suffering is inevitable, but the courage to fight it renders life worth living.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2015,"article":"Within the span of a hundred years, in the seventeenth and early eighteenth centuries, a tide of emigration – one of the great folk wanderings of history – swept from Europe to America. 46 This movement, driven by powerful and diverse motivations, built a nation out of a wilderness and, by its nature, shaped the character and destiny of an uncharted continent.\n\n(47) The United States is the product of two principal forces – the immigration of European peoples with their varied ideas, customs, and national characteristics and the impact of a new country which modified these traits. Of necessity, colonial America was a projection of Europe. Across the Atlantic came successive groups of Englishmen, Frenchmen, Germans, Scots, Irishmen, Dutchmen, Swedes, and many others who attempted to transplant their habits and traditions to the new world. (48) But the force of geographic conditions peculiar to America, the interplay of the varied national groups upon one another, and the sheer difficulty of maintaining old-world ways in a raw, new continent caused significant changes. These changes were gradual and at first scarcely visible. But the result was a new social pattern which, although it resembled European society in many ways, had a character that was distinctly American.\n\n(49) The first shiploads of immigrants bound for the territory which is now the United\n\nStates crossed the Atlantic more than a hundred years after the 15th-and-16th-century explorations of North America. In the meantime, thriving Spanish colonies had been established in Mexico, the West Indies, and South America. These travelers to North America came in small, unmercifully overcrowded craft. During their six- to twelve-week voyage, they survived on barely enough food allotted to them. Many of the ships were lost in storms, many passengers died of disease, and infants rarely survived the journey. Sometimes storms blew the vessels far off their course, and often calm brought unbearably long delay.\n\nTo the anxious travelers the sight of the American shore brought almost inexpressible relief.\n\nSaid one recorder of events, “The air at twelve leagues’ distance smelt as sweet as a new-blown\n\ngarden.” The colonists’ first glimpse of the new land was a sight of dense woods. (50) The\n\nvirgin forest with its richness and variety of trees was a real treasure-house which\n\nextended from Maine all the way down to Georgia. Here was abundant fuel and lumber. Here\n\nwas the raw material of houses and furniture, ships and potash, dyes and naval stores.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2016,"article":"Mental health is our birthright. (46) We don't have to learn how to be mentally healthy; it is built into us in the same way that our bodies know how to heal a cut or mend a broken bone. Mental health can't be learned, only reawakened. It is like the immune system of the body, which under stress or through lack of nutrition or exercise can be weakened, but which never leaves us. When we don't understand the value of mental health and we don't know how to gain access to it, mental health will remain hidden from us. (47) Our mental health doesn't really go anywhere; like the sun behind a cloud, it can be temporarily hidden from view, but it is fully capable of being restored in an instant.\n\nMental health is the seed that contains self-esteem – confidence in ourselves and an ability to trust in our common sense. It allows us to have perspective on our lives – the ability to not take ourselves too seriously, to laugh at ourselves, to see the bigger picture, and to see that things will work out. It’s a form of innate or unlearned optimism. (48) Mental health allows us to view others with sympathy if they are having troubles, with kindness if they are in pain, and with unconditional love no matter who they are. Mental health is the source of creativity for solving problems, resolving conflict, making our surroundings more beautiful, managing our home life, or coming up with a creative business idea or invention to make our lives easier. It\n\ngives us patience for ourselves and toward others as well as patience while driving, catching a fish, working on our car, or raising a child. It allows us to see the beauty that surrounds us each moment in nature, in culture, in the flow of our daily lives.\n\n(49) Although mental health is the cure-all for living our lives, it is perfectly ordinary as you will see that it has been there to direct you through all your difficult decisions. It has been available even in the most mundane of life situations to show you right from wrong, good from bad, friend from foe. Mental health has commonly been called conscience, instinct, wisdom, common sense, or the inner voice. We think of it simply as a healthy and helpful flow of intelligent thought. (50) As you will come to see, knowing that mental health is always available and knowing to trust it allow us to slow down to the moment and live life happily.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2017,"article":"The growth of the use of English as the world's primary language for international communication has obviously been continuing for several decades. (46) But even as the number of English speakers expands further there are signs that the global predominance of the language may fade within the foreseeable future.\n\nComplex international, economic, technological and cultural changes could start to diminish the leading position of English as the language of the world market, and UK interests which enjoy advantage from the breadth of English usage would consequently face new pressures. Those realistic possibilities are highlighted in the study presented by David Graddol. (47) His analysis should therefore end any self-contentedness among those who may believe that the global position of English is so stable that the young generations of the United Kingdom do not need additional language capabilities.\n\nDavid Graddol concludes that monoglot English graduates face a bleak economic future as qualified multilingual youngsters from other countries are proving to have a competitive advantage over their British counterparts in global companies and organisations. Alongside that, (48) many countries are introducing English into the primary-school curriculum but British schoolchildren and students do not appear to be gaining greater encouragement to\n\n##### achieve fluency in other languages.\n\nIf left to themselves, such trends will diminish the relative strength of the English language in international education markets as the demand for educational resources in languages, such as Spanish, Arabic or Mandarin grows and international business process outsourcing in other languages such as Japanese, French and German, spreads.\n\n(49) The changes identified by David Graddol all present clear and major challenges to the UK's providers of English language teaching to people of other countries and to broader education business sectors. The English language teaching sector directly earns nearly £1.3 billion for the UK in invisible exports and our other education related exports earn up to £10 billion a year more. As the international education market expands, the recent slowdown in the numbers of international students studying in the main English-speaking countries is likely to continue, especially if there are no effective strategic policies to prevent such slippage.\n\nThe anticipation of possible shifts in demand provided by this study is significant: (50)\n\nIt gives a basis to all organisations which seek to promote the learning and use of English, a basis for planning to meet the possibilities of what could be a very different operating environment. That is a necessary and practical approach. In this as in much else, those who wish to influence the future must prepare for it.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2018,"article":"Shakespeare’s lifetime was coincident with a period of extraordinary activity and achievement in the drama. (46) By the date of his birth Europe was witnessing the passing of the religious drama, and the creation of new forms under the incentive of classical tragedy and comedy. These new forms were at first mainly written by scholars and performed by amateurs, but in England, as everywhere else in western Europe, the growth of a class of professional actors was threatening to make the drama popular, whether it should be new or old, classical or medieval, literary or farcical. Court, school, organizations of amateurs, and the traveling actors were all rivals in supplying a widespread desire for dramatic entertainment; and (47) no boy who went to a grammar school could be ignorant that the drama was a form of literature which gave glory to Greece and Rome and might yet bring honor to England.\n\nWhen Shakespeare was twelve years old the first public playhouse was built in London. For a time literature showed no interest in this public stage. Plays aiming at literary distinction were written for schools or court, or for the choir boys of St. Paul's and the royal chapel, who, however, gave plays in public as well as at court. (48) But the professional companies prospered in their permanent theaters, and university men with literary ambitions were quick to turn to these theaters as offering a means of livelihood. By the time that\n\nShakespeare was twenty-five, Lyly, Peele, and Greene had made comedies that were at once popular and literary; Kyd had written a tragedy that crowded the pit; and Marlowe had brought poetry and genius to triumph on the common stage – where they had played no part since the death of Euripides. (49) A native literary drama had been created, its alliance with the public playhouses established, and at least some of its great traditions had been begun.\n\nThe development of the Elizabethan drama for the next twenty-five years is of exceptional interest to students of literary history, for in this brief period we may trace the beginning, growth, blossoming, and decay of many kinds of plays, and of many great careers. We are amazed today at the mere number of plays produced, as well as by the number of dramatists writing at the same time for this London of two hundred thousand inhabitants. (50) To realize how great was the dramatic activity, we must remember further that hosts of plays have been lost, and that probably there is no author of note whose entire work has survived.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2019,"article":"It was only after I started to write a weekly column about the medical journals, and began to read scientific papers from beginning to end, that I realised just how bad much of the medical literature frequently was. I came to recognise various signs of a bad paper: the kind of paper that purports to show that people who eat more than one kilo of broccoli a week were 1.17 times more likely than those who eat less to suffer late in life from pernicious anaemia. (46) There is a great deal of this kind of nonsense in the medical journals which, when taken up by broadcasters and the lay press, generates both health scares and short-lived dietary enthusiasm.\n\nWhy is so much bad science published? A recent paper, titled “The Natural Selection of Bad Science”, published on the Royal Society’s open science website, attempts to answer this intriguing and important question. It says that the problem is not merely that people do bad science, but that our current system of career advancement positively encourages it. What is important is not truth, but publication, which has become almost an end in itself. There has been a kind of inflationary process at work: (47) nowadays anyone applying for a research post has to have published twice the number of papers that would have been required for the same post only 10 years ago. Never mind the quality, then, count the number.\n\n(48) Attempts have been made to curb this tendency, for example, by trying to incorporate some measure of quality as well as quantity into the assessment of an applicant's papers. This is the famed citation index, that is to say the number of times a paper has been quoted elsewhere in the scientific literature, the assumption being that an important paper will be cited more often than one of small account. (49) This would be reasonable if it were not for the fact that scientists can easily arrange to cite themselves in their future publications, or get associates to do so for them in return for similar favours.\nBoiling down an individual's output to simple metrics, such as number of publications or journal impacts, entails considerable savings in time, energy and ambiguity. Unfortunately, the long-term costs of using simple quantitative metrics to assess researcher merit are likely to be quite great. (50) If we are serious about ensuring that our science is both meaningful and reproducible, we must ensure that our institutions encourage that kind of science.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2020,"article":"Following the explosion of creativity in Florence during the 14th century known as the Renaissance, the modern world saw a departure from what it had once known. It turned from God and the authority of the Roman Catholic Church and instead favoured a more humanistic approach to being. Renaissance ideas had spread throughout Europe well into the 17th century, with the arts and sciences flourishing extraordinarily among those with a more logical disposition. (46) With the Church's teachings and ways of thinking eclipsed by the Renaissance, the gap between the Medieval and modern periods had been bridged leading to new and unexplored intellectual territories.\n\nDuring the Renaissance, the great minds of Nicolaus Copernicus, Johannes Kepler and Galileo Galilei demonstrated the power of scientific study and discovery. (47) Before each of their revelations many thinkers at the time had sustained more ancient ways of thinking, including the geocentric view that the Earth was at the centre of our universe. Copernicus theorized in 1543 that all of the planets that we knew of revolved not around the Earth, but the Sun, a system that was later upheld by Galileo at his own expense. Offering up such a theory during a time of high tension between scientific and religious minds was branded as heresy and\n\nany such heretics that continued to spread these lies were to be punished by imprisonment or even death.\n\n(48) Despite attempts by the Church to suppress. this new generation of logicians and rationalists, more explanations for how the universe functioned were being made at a rate that the people could no longer ignore. It was with these great revelations that a new kind of philosophy founded in reason was born.\n\nThe Church’s long-standing dogma was losing the great battle for truth to rationalists and scientists. This very fact embodied the new ways of thinking that swept through Europe during most of 17th century. (49) As many took on the duty of trying to integrate reasoning and scientific philosophies into the world, the Renaissance was over and it was time for a new era - the Age of Reason.\n\nThe 17th and 18th centuries were times of radical change and curiosity, Scientific method, reductionism and the questioning of Church ideals was to be encouraged, as were ideas of liberty, tolerance and progress. (50) Such actions to seek knowledge and to understand what information we already knew were captured by the Latin phrase ‘sapere aude’ or ‘dare to know’, after Immanuel Kant used it in his essay An Answer to the Question: What is","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2021,"article":"World War II was the watershed event for higher education in modern Western societies. (46)\n\nThose societies came out of the war with levels of enrollment that had been roughly constant at 3-5% of the relevant age groups during the decades before the war. But after the war, great social and political changes arising out of the successful war against Fascism created a growing demand in European and American economies for increasing numbers of graduates with more than a secondary school education. (47) And the demand that rose in those societies for entry to higher education extended to groups and social classes that had not thought of attending a university before the war. These demands resulted in a very rapid expansion of the systems of higher education, beginning in the 1960s and developing very rapidly (though unevenly) during the 1970s and 1980s.\n\nThe growth of higher education manifests itself in at least three quite different ways, and these in turn have given rise to different sets of problems. There was first the rate of growth: (48) in many countries of Western Europe, the numbers of students in higher education doubled within five-year periods during the 1960s and doubled again in seven, eight, or 10 years by the middle of the 1970s. Second, growth obviously affected the absolute size both of\n\nsystems and individual institutions. And third, growth was reflected in changes in the proportion of the relevant age group enrolled in institutions of higher education.\n\nEach of these manifestations of growth carried its own peculiar problems in its wake. For example, a high growth rate placed great strains on the existing structures of governance, of administration, and above all of socialization. When a faculty or department grows from, say, five to 20 members within three or four years, (49) and when the new staff are predominantly young men and women fresh from postgraduate study, they largely define the norms of academic life in that faculty. And if the postgraduate student population also grows rapidly and there is loss of a close apprenticeship relationship between faculty members and students, the student culture becomes the chief socializing force for new postgraduate students, with consequences for the intellectual and academic life of the institution—this was seen in America as well as in France, Italy, West Germany, and Japan. (50) High growth rates increased the chances for academic innovation; they also weakened the forms and processes by which teachers and students are admitted into a community of scholars during periods of stability or slow growth. In the 1960s and 1970s, European universities saw marked changes in their governance arrangements, with empowerment of junior faculty and to some degree of students as well.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2022,"article":"Between 1807 and 1814 the Iberian Peninsula (comprising Spain and Portugal) was the scene of a titanic and merciless struggle. It took place on many different planes: between Napoleon's French army and the angry inhabitants; between the British, ever keen to exacerbate the emperor's difficulties, and the marshals sent from Paris to try to keep them in check; between new forces of science and meritocracy and old ones of conservatism and birth. (46) It was also, and this is unknown even to many people well read about the period, a battle between those who made codes and those who broke them.\n\nI first discovered the Napoleonic cryptographic battle a few years ago when I was reading Sir Charles Oman's epic History of the Peninsular War. In volume V he had attached an appendix, The Scovell Ciphers. (47) It listed many documents in code that had been captured from the French army of Spain, and whose secrets had been revealed by the work of one George Scovell , an officer in British headquarters. Oman rated Scovell's significance highly, but at the same time, the general nature of his History meant that (48) he could not analyze carefully what this obscure officer may or may not have contributed to that great struggle between nations or indeed tell us anything much about the man himself.\n\nI was keen to read more, but was surprised to find that Oman's appendix, published in 1914, was the only considered thing that had been written about this secret war.\n\nI became convinced that this story was every bit as exciting and significant as that of Enigma and the breaking of German codes in the Second World War. The question was, could it be told?\n\nStudying Scovell's papers at the Public Record Office, London, I found that he had left an extensive journal and copious notes about his work in the peninsula. What was more, many original French dispatches had been preserved in this collection, which I realized was priceless. (49) There may have been many spies and intelligence officers during the Napoleonic Wars, but it is usually extremely difficult to find the material they actually provided or worked on.\n\nAs I researched Scovell's story I found far more of interest besides his intelligence work. His status in Lord Wellington's headquarters and the recognition given to him for his work were all bound up with the class politics of the army at the time. His tale of self-improvement and hard work would make a fascinating biography in its own right, but represents something more than that. (50) Just as the code breaking has its wider relevance in the struggle for Spain, so his attempts to make his way up the promotion ladder speak volumes about British society.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2023,"article":"There has been some exploration around the use of AI in digital marketing. For example, AI can be used to analyse what type of advertising content or copy would be appropriate to 'speak' to a specific target customer group by revealing information about trends and preferences through the analysis of big data. 46 AI can also be used to identify the lifestyle choices of customers regarding their hobbies,favourite celebrities, music choices, and fashions to provide unique content in marketing messages put out through social media. At the same time AI can also be used to generate content for social media posts and chat sites. AI can also provide a bridge between the need of the brand to communicate emotionally with the customer and identifying their rapidly changing needs.\n\nThe main disadvantage of using AI to respond to customers is that there are concerns about\n\ntrusting personal interactions to machines, which could lead not only to the subsequent loss of\n\ninterpersonal connections, but also to a decrease in marketing personnel. (47) Some believe that\n\nAI is negatively impacting on the marketer's role by reducing creativity and removing\n\njobs,but they are aware that it is a way of reducing costs and creating new information. By\n\nallowing AI to develop content some brand marketers may find that they are losing control over\n\nthe brand narrative. (48) Algorithms that are used to simulate human interactions are\n\ncreating many of these concerns, especially as no-one is quite sure what the outcomes of\n\n\\underline{\\text{using AI to interact with customers will be.\n\nFor AI to be successful, data needs to be accessible, but the use of personal data is becoming more regulated and the automated sharing of data is becoming more difficult. (49) If customers are not willing to share data, AI will be starved of essential information and will not be able to function effectively or employ machine learning to improve its marketing content and communication. Therefore,unless customers are prepared to sign release agreements,the use of AI may become somewhat restricted in the future. Not only can AI help to create the marketing content, but it can also provide a non-intrusive way of delivering the content to the target customers. Data can be gathered on where the customer can be engaged, such as location, devices used,website interactions, and sites visited, to display marketing messages in appropriate forms, including emails, social media posts, pop-up advertisements, and banners at an appropriate frequency. (50) The non-intrusive delivery of the marketing messages in a way that is sensitive to the needs of the target customer is one of the critical challenges to the digital marketer.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]},{"year":2024,"article":"\"Elephants never forget\" - or so they say - and that piece of folklore seems to have some foundation.\n\nThe African savanna elephant, also known as the African bush elephant, is distributed across 37 African countries. They move between a variety of habitats, including forests, grasslands, woodlands, wetlands and agricultural land. (46)They sometimes travel more than sixty miles to find food or water, and are very good at working out where other elephants are - even when they are out of sight. Using tracking devices, researchers have shown that they have \"remarkable spatial acuity.\" When finding their way to waterholes, they headed off in exactly the right direction, on one occasion from a distance of roughly thirty miles. What is more,they almost always seem to choose the nearest waterhole. (47) The researchers are convinced that the elephants always know precisely where they are in relation to all the resources they need,and can therefore take shortcuts, as well as following familiar routes.\n\nAlthough the cues used by African elephants for long-distance navigation are not yet understood, smell may well play a part.\n\nElephants are very choosy eaters, but until recently little was known about how they selected their food. (48) One possibility was that they merely used their eyes and tried out the plants they found. but that would probably result in a lot of wasted time and energy,not leas! because their eyesight is actually not very good.\n\n(49)The volatile chemicals produced by plants can be carried a long way,and they are very characteristic: Each plant or tree has its own particular odor signature.What is more, they can be detected even when they are not actually visible. New research suggests that smell is a crucial factor in guiding elephants - and probably other herbivores- to the best food resources.\n\nThe researchers first established what kinds of plant the elephants preferred either to eat or avoid when foraging freely. They then set up a \"food station\" experiment, in which they gave the elephants a series of choices based only on smell.(50) The experiment showed that elephants may well use smell to identify patches of trees that are good to eat and secondly to assess the quality of the trees within each patch. Free-ranging elephants presumably also use this information to locate their preferred food.\n\nTheir well-developed hippocampal structures may enable elephants, like rats and people, to construct cognitive maps.","questions":[{"n":46,"text":"","verified":false},{"n":47,"text":"","verified":false},{"n":48,"text":"","verified":false},{"n":49,"text":"","verified":false},{"n":50,"text":"","verified":false}]}]</script><script>
const DB=JSON.parse(document.getElementById("data").textContent), KEY="kaoyan-english-translation-v1";
let state={answers:{},wrong:{},completed:{},year:2010},onlyWrong=false;
try{const s=JSON.parse(localStorage.getItem(KEY)||"{}");state={...state,...s}}catch(e){}
const $=id=>document.getElementById(id);
const escapeHTML=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert("浏览器存储不可用，请导出备份")}};
function key(n){return state.year+"-"+n}
function cur(){return DB.find(x=>x.year===state.year)}
function renderYears(){ $("years").innerHTML=DB.map(d=>'<button class="yr '+(d.year===state.year?'active ':'')+(d.questions.every(q=>(state.answers[d.year+"-"+q.n]||"").trim())?'done':'')+'" data-year="'+d.year+'">'+d.year+'</button>').join(""); document.querySelectorAll("[data-year]").forEach(e=>e.onclick=()=>{state.year=Number(e.dataset.year);save();render()})}
function renderArticle(){
 let t=cur().article;
 const q=cur().questions;
 // 仅对可在文章中逐字定位的句子标记，以免错位
 const marks=[];
 for(const item of q){if(item.text&&t.includes("("+item.n+") "+item.text)){marks.push({n:item.n,start:t.indexOf("("+item.n+") "+item.text),length:("("+item.n+") "+item.text).length})}}
 marks.sort((a,b)=>a.start-b.start);
 let out="",last=0;
 for(const m of marks){out+=escapeHTML(t.slice(last,m.start));out+='<mark class="hit" data-jump="'+m.n+'">'+escapeHTML(t.slice(m.start,m.start+m.length))+'</mark>';last=m.start+m.length}out+=escapeHTML(t.slice(last));
 $("article").innerHTML=out.split(/\n\s*\n/).map(p=>"<p>"+p+"</p>").join("");
 document.querySelectorAll("[data-jump]").forEach(e=>e.onclick=()=>document.getElementById("card"+e.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"center"}));
}
function renderCards(){
 const d=cur(),q=d.questions.filter(x=>!onlyWrong||state.wrong[key(x.n)]);
 $("note").textContent=d.year===2010?"2010年已按原题重新校对划线句。先独立翻译；参考译文与解析在提交后提供。":"提示：本年份原文由 OCR 资料整理，尚未逐句人工校对。若出现划线范围缺失、错字或明显断句，请以原版真题为准；不要将自动截取内容视作已确认的划线范围。";
 $("cards").innerHTML=q.map(item=>'<div class="qcard" id="card'+item.n+'"><div class="qhead"><strong>第'+item.n+'题 · 2分</strong><label class="checkrow"><input type="checkbox" data-wrong="'+item.n+'" '+(state.wrong[key(item.n)]?'checked':'')+'>列为错题</label></div><div class="qtext">'+escapeHTML(item.text||"OCR未准确识别本题范围，请查看左侧原文并对照原卷。")+'</div>'+(item.verified?'':'<div class="small">OCR自动提取，划线范围待核对</div>')+'<textarea data-answer="'+item.n+'" placeholder="在这里写下你的中文译文……"></textarea></div>').join("");
 document.querySelectorAll("[data-answer]").forEach(t=>{t.value=state.answers[key(t.dataset.answer)]||"";t.oninput=()=>{state.answers[key(t.dataset.answer)]=t.value;save();updateProgress()};});
 document.querySelectorAll("[data-wrong]").forEach(c=>{c.onchange=()=>{state.wrong[key(c.dataset.wrong)]=c.checked;save();if(onlyWrong)renderCards()}});
 updateProgress();
}
function updateProgress(){let x=cur().questions.filter(q=>(state.answers[key(q.n)]||"").trim()).length;$("progressLabel").textContent="已作答 "+x+" / 5 · 自动保存";$("bar").style.width=(x*20)+"%";renderYears()}
function render(){renderYears();$("articleTitle").textContent=state.year+"年 · 英语一翻译";$("leftInfo").textContent="Part C / 46—50";renderArticle();renderCards();$("artScroll").scrollTop=0;$("answerScroll").scrollTop=0}
$("wrongOnly").onclick=()=>{onlyWrong=!onlyWrong;$("wrongOnly").textContent="只看错题："+(onlyWrong?"开":"关");renderCards()};
$("reset").onclick=()=>{if(confirm("确定清空"+state.year+"年的5道译文？不可撤销。")){for(let n=46;n<=50;n++)delete state.answers[key(n)];save();renderCards()}};
$("copy").onclick=async()=>{let d=cur(),s="考研英语一 "+state.year+"年翻译答题\n"+d.questions.map(q=>"第"+q.n+"题\n原文："+q.text+"\n我的译文："+(state.answers[key(q.n)]||"【未作答】")).join("\n\n")+"\n\n请按每题2分评分，逐句指出错译漏译、句法问题并总结复练要点。";
 try{await navigator.clipboard.writeText(s);alert("已复制全部译文，可粘贴到 ChatGPT 进行批改")}catch(e){let t=document.createElement("textarea");t.value=s;document.body.append(t);t.select();document.execCommand("copy");t.remove();alert("已尝试复制译文")}};
$("export").onclick=()=>{let blob=new Blob([JSON.stringify({type:"kaoyan-english-translation",version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="考研英语翻译训练备份.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.type!=="kaoyan-english-translation"||!d.state?.answers)throw Error("不是有效的训练备份");if(!confirm("导入将覆盖此浏览器中的现有训练记录，确定继续？"))return;state={...state,...d.state};save();render();alert("导入成功")}catch(err){alert("导入失败："+err.message)}e.target.value=""};
render();
</script></body></html>
